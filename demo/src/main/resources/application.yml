server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:demodb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  sql:
    init:
      mode: always

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# Full table interceptor configuration
mybatis.full-table:
  enabled: true
  block-select: true
  block-update: true
  block-delete: true
  mode: STRICT
